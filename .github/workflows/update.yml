name: Update Steam upcoming games

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:        # allows the manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch games from Steam
        run: python3 fetch_games.py

      - name: Commit games.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update games.json"
            git push
          fi
